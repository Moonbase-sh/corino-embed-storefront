<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a130c"/>
      <stop offset="100%" stop-color="#0a0706"/>
    </linearGradient>
    <radialGradient id="warmth" cx="50%" cy="62%" r="60%">
      <stop offset="0%" stop-color="#c76b2c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c76b2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="36%" r="65%">
      <stop offset="0%"  stop-color="#fae0a8"/>
      <stop offset="35%" stop-color="#f0a755"/>
      <stop offset="70%" stop-color="#bf551d"/>
      <stop offset="100%" stop-color="#4a1f0d"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#eca45d" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#eca45d" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#eca45d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#eca45d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="35%">
      <stop offset="0%"  stop-color="#e89548" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#e89548" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base + warm wash -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#warmth)"/>

  <!-- Concentric horizon rings, centered low -->
  <g fill="none">
    <circle cx="256" cy="318" r="118" stroke="#eca45d" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="256" cy="318" r="158" stroke="#eca45d" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle cx="256" cy="318" r="206" stroke="#eca45d" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="256" cy="318" r="260" stroke="#eca45d" stroke-opacity="0.07" stroke-width="1.5"/>
  </g>

  <!-- Sun glow -->
  <circle cx="256" cy="318" r="170" fill="url(#glow)"/>

  <!-- Sun -->
  <circle cx="256" cy="318" r="92" fill="url(#sun)"/>

  <!-- Horizon line -->
  <rect x="0" y="317" width="512" height="1.5" fill="url(#horizon)"/>
</svg>
